# Pre-commit hooks for FPD MCP
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
          - '--exclude-files'
          - 'configs/.*\.json'
          - '--exclude-files'
          - '\.md$'
          - '--exclude-files'
          - 'package-lock\.json'
          - '--exclude-files'
          - '\.baseline$'
        exclude: ^\.secrets\.baseline$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.secrets\.baseline$
      - id: end-of-file-fixer
        exclude: ^\.secrets\.baseline$
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        exclude: ^configs/.*\.json$  # Allow placeholder keys in example configs
      - id: check-merge-conflict
      - id: detect-private-key

  # Q-1: the C901 complexity gate, the mypy config and a ~15-second test
  # suite were all committed and none of them ran automatically — the only
  # two workflows were security scanners. ruff runs per commit; pytest runs
  # on push, where 15 seconds is affordable.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--config, pyproject.toml]
        files: ^src/

  - repo: local
    hooks:
      - id: pytest
        name: pytest (fast suite)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: prompt-injection-check
        name: Check for prompt injection patterns (Unicode steganography & FPD attacks)
        entry: uv run python .security/check_prompt_injections.py
        language: system
        files: \.(py|txt|md|yml|yaml|json|js|ts|html|xml|csv|rst|cfg|ini|toml|log|env|sh|bat|ps1)$
        exclude: ^(\.security/.*\.py|SECURITY_.*\.md|PROMPTS\.md|README\.md|CLAUDE\.md|\.github/workflows/.*\.yml|deploy/.*|src/fpd_mcp/prompts/.*\.py|src/fpd_mcp/shared/injection_scan\.py|tests/test_injection_scan\.py|docs/CONTENT_PROVENANCE\.md)$
